name: Upstream Release Watcher

on:
  schedule:
    # Run every Sunday at midnight
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  check-upstream-updates:
    name: Check Upstream Version Updates
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fetch Latest Versions from Both Upstreams
        id: fetch
        env:
          # Authenticate to avoid the 60 req/h unauthenticated rate limit on shared runner IPs
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # josdejong/jsonrepair publishes git tags only (no GitHub Releases) -> poll /tags
          JOSDEJONG_LATEST=$(gh api "repos/josdejong/jsonrepair/tags?per_page=1" --jq '.[0].name')
          # mangiucugna/json_repair publishes GitHub Releases -> poll /releases/latest
          MANGIUCUGNA_LATEST=$(gh api repos/mangiucugna/json_repair/releases/latest --jq '.tag_name')

          # Fail fast on empty/null API results instead of comparing garbage
          for v in "$JOSDEJONG_LATEST" "$MANGIUCUGNA_LATEST"; do
            if [ -z "$v" ] || [ "$v" = "null" ]; then
              echo "::error::Failed to fetch upstream version(s) from the GitHub API."
              exit 1
            fi
          done

          echo "josdejong_latest=$JOSDEJONG_LATEST" >> $GITHUB_OUTPUT
          echo "mangiucugna_latest=$MANGIUCUGNA_LATEST" >> $GITHUB_OUTPUT
          echo "Latest josdejong/jsonrepair tag: $JOSDEJONG_LATEST"
          echo "Latest mangiucugna/json_repair release: $MANGIUCUGNA_LATEST"

      - name: Compare with Tracked Versions in docs/UPSTREAM.md
        run: |
          # One pin-table cell per upstream. `grep -oP 'josdejong/jsonrepair@\K[v0-9.]+'`
          # also matches the change-log rows, so it prints v3.15.0 twice. The comparison
          # is then "v3.15.0\nv3.15.0" != "v3.15.0" and the job always emits a false
          # "new josdejong tag" notice. The mangiucugna pin is duplicated the same way.
          # `head -n 1` keeps a single line even if the table is ever repeated.
          TRACKED_JOSDEJONG=$(grep -oP '\[josdejong/jsonrepair\]\(https://github.com/josdejong/jsonrepair\) \| `\Kv[0-9.]+' docs/UPSTREAM.md | head -n 1 || true)
          TRACKED_MANGIUCUGNA=$(grep -oP '\[mangiucugna/json_repair\]\(https://github.com/mangiucugna/json_repair\) \| `\Kv[0-9.]+' docs/UPSTREAM.md | head -n 1 || true)
          if [ -z "${TRACKED_JOSDEJONG}" ]; then TRACKED_JOSDEJONG="unknown"; fi
          if [ -z "${TRACKED_MANGIUCUGNA}" ]; then TRACKED_MANGIUCUGNA="unknown"; fi
          JOSDEJONG_LATEST="${{ steps.fetch.outputs.josdejong_latest }}"
          MANGIUCUGNA_LATEST="${{ steps.fetch.outputs.mangiucugna_latest }}"

          if [ "$TRACKED_JOSDEJONG" != "$JOSDEJONG_LATEST" ]; then
            echo "::notice ::New josdejong/jsonrepair tag detected! Tracked: $TRACKED_JOSDEJONG, Latest: $JOSDEJONG_LATEST"
          else
            echo "josdejong/jsonrepair is in sync ($TRACKED_JOSDEJONG)."
          fi

          if [ "$TRACKED_MANGIUCUGNA" != "$MANGIUCUGNA_LATEST" ]; then
            echo "::notice ::New mangiucugna/json_repair release detected! Tracked: $TRACKED_MANGIUCUGNA, Latest: $MANGIUCUGNA_LATEST"
          else
            echo "mangiucugna/json_repair is in sync ($TRACKED_MANGIUCUGNA)."
          fi
