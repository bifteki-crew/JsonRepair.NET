name: JsonRepair.NET CI Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  build-and-test:
    name: Build, Lint & Test (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify Code Formatting (dotnet format)
        run: dotnet format --verify-no-changes --verbosity diagnostic

      - name: Restore Dependencies
        run: dotnet restore

      # dotnet list exits 0 even when it finds something, so the table rows are the signal.
      # CVE-2026-62900 reached this repo through a transitive build-time dependency and Dependabot
      # did not flag it; this step is what catches that class. Add continue-on-error: true if a
      # freshly published advisory should warn rather than block unrelated work.
      - name: Check for Vulnerable Dependencies
        run: |
          out=$(dotnet list package --vulnerable --include-transitive 2>&1)
          echo "$out"
          # Leading whitespace optional: the table currently indents rows, but the gate must not
          # depend on that formatting staying put.
          if echo "$out" | grep -qE '^[[:space:]]*> '; then
            echo "::error::Vulnerable package(s) found - see the table above"
            exit 1
          fi
          echo "No vulnerable packages."

      - name: Build Solution (Release)
        run: dotnet build --configuration Release --no-restore /p:TreatWarningsAsErrors=true

      - name: Run Unit Tests
        run: dotnet test --configuration Release --no-build --verbosity normal

      # Benchmarks run on demand only (see benchmarks.yml, workflow_dispatch) to keep push CI fast.
